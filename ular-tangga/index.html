<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🐍 Ular Tangga 3D vs AI 🎲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            color: white;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
        }
        .player-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 2px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            min-width: 200px;
        }
        .player-card.active {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            transform: scale(1.02);
        }
        .player-card .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }
        .player-card.white .avatar {
            background: linear-gradient(135deg, #ffffff, #e0e0e0);
            color: #333;
        }
        .player-card.black .avatar {
            background: linear-gradient(135deg, #333333, #1a1a1a);
            color: #fff;
            border: 2px solid #666;
        }
        .player-card .info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .player-card .name {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        .player-card .position {
            font-size: 20px;
            font-weight: 700;
            color: #ffd700;
        }
        .player-card .position small {
            font-size: 12px;
            color: #aaa;
            font-weight: 400;
        }

        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            pointer-events: none;
        }
        .dice-container {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #dice-display {
            width: 100px;
            height: 100px;
            background: linear-gradient(145deg, #ffffff, #d0d0d0);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            font-weight: 800;
            color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 -5px 15px rgba(0,0,0,0.1);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            position: relative;
        }
        #dice-display.rolling {
            animation: diceRoll 0.6s ease-in-out;
        }
        @keyframes diceRoll {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.1); }
            50% { transform: rotate(180deg) scale(1.2); }
            75% { transform: rotate(270deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        #roll-btn {
            pointer-events: auto;
            padding: 14px 40px;
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(145deg, #ffd700, #ff8c00);
            color: #1a1a1a;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4), 0 4px 0 #b8860b;
            transition: all 0.1s ease;
            font-family: inherit;
        }
        #roll-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 215, 0, 0.6), 0 6px 0 #b8860b;
        }
        #roll-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4), 0 2px 0 #b8860b;
        }
        #roll-btn:disabled {
            background: linear-gradient(145deg, #555, #333);
            color: #888;
            cursor: not-allowed;
            box-shadow: 0 4px 0 #1a1a1a, 0 8px 20px rgba(0,0,0,0.4);
            transform: translateY(4px);
        }

        .message-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 60px;
            text-align: center;
            border: 3px solid #ffd700;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.5);
            pointer-events: auto;
            z-index: 100;
            transition: all 0.5s ease;
            max-width: 90%;
        }
        .message-box.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.8);
        }
        .message-box h1 {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .message-box p {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 25px;
        }
        .message-box button {
            padding: 14px 50px;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(145deg, #ffd700, #ff8c00);
            color: #1a1a1a;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: inherit;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }
        .message-box button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.6);
        }

        .turn-indicator {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 2px solid rgba(255, 215, 0, 0.3);
            z-index: 20;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .turn-indicator.white-turn {
            border-color: rgba(255, 255, 255, 0.6);
            color: #fff;
        }
        .turn-indicator.black-turn {
            border-color: rgba(100, 100, 100, 0.8);
            color: #aaa;
        }

        @media (max-width: 600px) {
            #dice-display { width: 70px; height: 70px; font-size: 40px; }
            #roll-btn { padding: 10px 28px; font-size: 16px; }
            .player-card { min-width: 140px; padding: 8px 12px; }
            .player-card .avatar { width: 36px; height: 36px; font-size: 20px; }
            .player-card .position { font-size: 16px; }
            .message-box h1 { font-size: 32px; }
            .message-box { padding: 30px 25px; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <div class="top-bar">
            <div class="player-card white active" id="player-white">
                <div class="avatar">♟️</div>
                <div class="info">
                    <div class="name">Pemain</div>
                    <div class="position" id="pos-white">0 <small>/ 100</small></div>
                </div>
            </div>
            <div class="player-card black" id="player-black">
                <div class="avatar">🤖</div>
                <div class="info">
                    <div class="name">AI Bot</div>
                    <div class="position" id="pos-black">0 <small>/ 100</small></div>
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="dice-container">
                <div id="dice-display">🎲</div>
                <button id="roll-btn" disabled>🎲 Lempar Dadu</button>
            </div>
        </div>
    </div>

    <div class="turn-indicator white-turn" id="turn-indicator">🎯 Giliran Pemain</div>

    <div class="message-box hidden" id="message-box">
        <h1 id="message-title">🎉 Menang!</h1>
        <p id="message-text">Selamat, kamu mengalahkan AI!</p>
        <button id="restart-btn">🔄 Main Lagi</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==================== KONFIGURASI GAME ====================
        const BOARD_SIZE = 10; // 10x10 = 100 kotak
        const TILE_SIZE = 1.6;
        const BOARD_OFFSET = -(BOARD_SIZE * TILE_SIZE) / 2 + TILE_SIZE / 2;

        // Definisikan ular dan tangga: { dari: ke }
        const SNAKES_AND_LADDERS = {
            // Tangga (naik)
            2: 23, 6: 45, 20: 59, 30: 49, 52: 72, 57: 96, 71: 92,
            // Ular (turun)
            98: 40, 84: 58, 87: 49, 73: 15, 56: 8, 50: 5, 43: 17, 29: 9, 16: 4
        };

        // ==================== STATE GAME ====================
        let scene, camera, renderer, controls;
        let playerPiece, aiPiece;
        let playerPos = 0;
        let aiPos = 0;
        let currentTurn = 'player'; // 'player' atau 'ai'
        let gameActive = true;
        let isAnimating = false;
        let diceValue = 0;
        let boardTiles = [];
        let snakeMeshes = [];
        let ladderMeshes = [];

        // ==================== INISIALISASI THREE.JS ====================
        function initThree() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.Fog(0x0a0a1a, 25, 60);

            // Camera
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(0, 22, 22);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.2;
            controls.minDistance = 12;
            controls.maxDistance = 40;
            controls.target.set(0, 0, 0);

            // Lighting
            setupLighting();

            // Build board
            buildBoard();

            // Create player pieces
            createPieces();

            // Build snakes and ladders
            buildSnakesAndLadders();

            // Start animation loop
            animate();

            // Handle resize
            window.addEventListener('resize', onResize);
        }

        function setupLighting() {
            // Ambient
            const ambient = new THREE.AmbientLight(0x404060);
            scene.add(ambient);

            // Main directional light
            const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
            dirLight.position.set(10, 25, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = 20;
            dirLight.shadow.camera.top = 20;
            dirLight.shadow.camera.bottom = -20;
            scene.add(dirLight);

            // Fill light
            const fillLight = new THREE.DirectionalLight(0x4466ff, 0.5);
            fillLight.position.set(-10, 10, -10);
            scene.add(fillLight);

            // Point lights for ambiance
            const point1 = new THREE.PointLight(0xff6600, 0.5, 30);
            point1.position.set(-8, 5, -8);
            scene.add(point1);
            const point2 = new THREE.PointLight(0x0066ff, 0.5, 30);
            point2.position.set(8, 5, 8);
            scene.add(point2);
        }

        // ==================== BUAT PAPAN ====================
        function buildBoard() {
            const boardGroup = new THREE.Group();

            // Base board (base plate)
            const baseGeo = new THREE.BoxGeometry(BOARD_SIZE * TILE_SIZE + 0.4, 0.3, BOARD_SIZE * TILE_SIZE + 0.4);
            const baseMat = new THREE.MeshStandardMaterial({
                color: 0x1a1a2e,
                roughness: 0.4,
                metalness: 0.3
            });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = -0.15;
            base.receiveShadow = true;
            boardGroup.add(base);

            // Border glow
            const borderGeo = new THREE.BoxGeometry(BOARD_SIZE * TILE_SIZE + 0.6, 0.1, BOARD_SIZE * TILE_SIZE + 0.6);
            const borderMat = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                emissive: 0xffd700,
                emissiveIntensity: 0.3,
                roughness: 0.3,
                metalness: 0.8
            });
            const border = new THREE.Mesh(borderGeo, borderMat);
            border.position.y = -0.32;
            boardGroup.add(border);

            // Tiles
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const tileNumber = getTileNumber(row, col);
                    const x = BOARD_OFFSET + col * TILE_SIZE;
                    const z = BOARD_OFFSET + (BOARD_SIZE - 1 - row) * TILE_SIZE;

                    const tileGeo = new THREE.BoxGeometry(TILE_SIZE * 0.95, 0.15, TILE_SIZE * 0.95);
                    const isLight = (row + col) % 2 === 0;
                    const color = isLight ? 0xe8d9b0 : 0x8b6f47;

                    const tileMat = new THREE.MeshStandardMaterial({
                        color: color,
                        roughness: 0.6,
                        metalness: 0.1
                    });

                    const tile = new THREE.Mesh(tileGeo, tileMat);
                    tile.position.set(x, 0, z);
                    tile.castShadow = true;
                    tile.receiveShadow = true;
                    tile.userData = { row, col, number: tileNumber };
                    boardGroup.add(tile);
                    boardTiles.push(tile);

                    // Number label (using canvas texture)
                    const labelTexture = createNumberTexture(tileNumber, isLight);
                    const labelGeo = new THREE.PlaneGeometry(TILE_SIZE * 0.6, TILE_SIZE * 0.6);
                    const labelMat = new THREE.MeshBasicMaterial({
                        map: labelTexture,
                        transparent: true,
                        depthWrite: false
                    });
                    const label = new THREE.Mesh(labelGeo, labelMat);
                    label.rotation.x = -Math.PI / 2;
                    label.position.set(x, 0.09, z);
                    boardGroup.add(label);

                    // Special coloring for start and end
                    if (tileNumber === 1) {
                        const startMark = new THREE.Mesh(
                            new THREE.RingGeometry(TILE_SIZE * 0.3, TILE_SIZE * 0.42, 32),
                            new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide })
                        );
                        startMark.rotation.x = -Math.PI / 2;
                        startMark.position.set(x, 0.1, z);
                        boardGroup.add(startMark);
                    }
                    if (tileNumber === 100) {
                        const endMark = new THREE.Mesh(
                            new THREE.RingGeometry(TILE_SIZE * 0.3, TILE_SIZE * 0.42, 32),
                            new THREE.MeshBasicMaterial({ color: 0xff4444, side: THREE.DoubleSide })
                        );
                        endMark.rotation.x = -Math.PI / 2;
                        endMark.position.set(x, 0.1, z);
                        boardGroup.add(endMark);
                    }
                }
            }

            scene.add(boardGroup);
        }

        function getTileNumber(row, col) {
            // Boustrophedon pattern (zig-zag)
            // Row 0 (bawah) = 1-10 (kiri ke kanan)
            // Row 1 = 11-20 (kanan ke kiri)
            const actualRow = BOARD_SIZE - 1 - row;
            if (actualRow % 2 === 0) {
                return actualRow * BOARD_SIZE + col + 1;
            } else {
                return actualRow * BOARD_SIZE + (BOARD_SIZE - col);
            }
        }

        function createNumberTexture(number, isLight) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            // Background (transparent)
            ctx.clearRect(0, 0, 128, 128);

            // Text
            ctx.fillStyle = isLight ? '#4a3520' : '#f0e0c0';
            ctx.font = 'bold 52px "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 4;
            ctx.fillText(number.toString(), 64, 68);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        // ==================== BUAT BIDAK PEMAIN ====================
        function createPieces() {
            // Player piece (white)
            const playerGeo = new THREE.ConeGeometry(0.4, 1.2, 32);
            const playerMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0xffffff,
                emissiveIntensity: 0.2,
                roughness: 0.2,
                metalness: 0.5
            });
            playerPiece = new THREE.Mesh(playerGeo, playerMat);
            playerPiece.castShadow = true;
            playerPiece.receiveShadow = true;
            playerPiece.position.y = 0.6;
            scene.add(playerPiece);

            // AI piece (black with red glow)
            const aiGeo = new THREE.ConeGeometry(0.4, 1.2, 32);
            const aiMat = new THREE.MeshStandardMaterial({
                color: 0x222222,
                emissive: 0xff3300,
                emissiveIntensity: 0.3,
                roughness: 0.3,
                metalness: 0.5
            });
            aiPiece = new THREE.Mesh(aiGeo, aiMat);
            aiPiece.castShadow = true;
            aiPiece.receiveShadow = true;
            aiPiece.position.y = 0.6;
            scene.add(aiPiece);

            updatePiecePositions(0);
        }

        // Konversi nomor kotak (1-100) ke posisi 3D
        function tileNumberToPosition(number) {
            if (number < 1) number = 1;
            if (number > 100) number = 100;

            const idx = number - 1;
            const actualRow = Math.floor(idx / BOARD_SIZE);
            const colInRow = idx % BOARD_SIZE;

            // Zig-zag
            let col;
            if (actualRow % 2 === 0) {
                col = colInRow;
            } else {
                col = BOARD_SIZE - 1 - colInRow;
            }

            const row = BOARD_SIZE - 1 - actualRow;

            const x = BOARD_OFFSET + col * TILE_SIZE;
            const z = BOARD_OFFSET + (BOARD_SIZE - 1 - row) * TILE_SIZE;

            return { x, z };
        }

        function updatePiecePositions(animProgress = 1) {
            const pPos = tileNumberToPosition(playerPos || 1);
            const aPos = tileNumberToPosition(aiPos || 1);

            // Offset sedikit agar tidak bertumpuk
            const offset = 0.25;

            playerPiece.position.x = pPos.x - offset;
            playerPiece.position.z = pPos.z - offset;

            aiPiece.position.x = aPos.x + offset;
            aiPiece.position.z = aPos.z + offset;
        }

        // ==================== BUAT ULAR DAN TANGGA ====================
        function buildSnakesAndLadders() {
            const group = new THREE.Group();

            for (const [from, to] of Object.entries(SNAKES_AND_LADDERS)) {
                const fromNum = parseInt(from);
                const toNum = parseInt(to);
                const fromPos = tileNumberToPosition(fromNum);
                const toPos = tileNumberToPosition(toNum);

                if (toNum > fromNum) {
                    // Tangga
                    createLadder(group, fromPos, toPos);
                } else {
                    // Ular
                    createSnake(group, fromPos, toPos);
                }
            }

            scene.add(group);
        }

        function createLadder(group, from, to) {
            const startY = 0.1;
            const endY = 0.1;
            const fromVec = new THREE.Vector3(from.x, startY, from.z);
            const toVec = new THREE.Vector3(to.x, endY, to.z);

            const distance = fromVec.distanceTo(toVec);
            const mid = fromVec.clone().lerp(toVec, 0.5);
            const direction = toVec.clone().sub(fromVec).normalize();

            // Ladder rails (2 parallel rails)
            const railLength = distance;
            const railRadius = 0.06;

            // Create orientation
            const up = new THREE.Vector3(0, 1, 0);
            const quaternion = new THREE.Quaternion().setFromUnitVectors(up, direction);

            // We need to place two rails offset perpendicular to direction
            const perpendicular = new THREE.Vector3(-direction.z, 0, direction.x).normalize();
            const railOffset = 0.25;

            const railMat = new THREE.MeshStandardMaterial({
                color: 0xc49a6c,
                roughness: 0.4,
                metalness: 0.2,
                emissive: 0x8b5a2b,
                emissiveIntensity: 0.1
            });

            // Rail 1
            const rail1Geo = new THREE.CylinderGeometry(railRadius, railRadius, railLength, 8);
            const rail1 = new THREE.Mesh(rail1Geo, railMat);
            const rail1Pos = mid.clone().add(perpendicular.clone().multiplyScalar(railOffset));
            rail1.position.copy(rail1Pos);
            rail1.quaternion.copy(quaternion);
            rail1.castShadow = true;
            group.add(rail1);

            // Rail 2
            const rail2 = new THREE.Mesh(rail1Geo, railMat);
            const rail2Pos = mid.clone().add(perpendicular.clone().multiplyScalar(-railOffset));
            rail2.position.copy(rail2Pos);
            rail2.quaternion.copy(quaternion);
            rail2.castShadow = true;
            group.add(rail2);

            // Rungs (steps)
            const numRungs = Math.floor(distance / 0.5);
            const rungMat = new THREE.MeshStandardMaterial({
                color: 0xd4a574,
                roughness: 0.5,
                metalness: 0.1
            });

            for (let i = 1; i < numRungs; i++) {
                const t = i / numRungs;
                const rungPos = fromVec.clone().lerp(toVec, t);
                const rungGeo = new THREE.CylinderGeometry(0.05, 0.05, railOffset * 2, 6);
                const rung = new THREE.Mesh(rungGeo, rungMat);

                // Rotate rung to be perpendicular to direction and align with perpendicular
                const rungDir = perpendicular.clone();
                const rungQuat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), rungDir);
                rung.quaternion.copy(rungQuat);
                rung.position.copy(rungPos);
                rung.castShadow = true;
                group.add(rung);
            }

            // Glow effect at start and end
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0x00ff88,
                transparent: true,
                opacity: 0.3,
                side: THREE.DoubleSide
            });
            const glowGeo = new THREE.RingGeometry(0.3, 0.45, 16);
            const glowStart = new THREE.Mesh(glowGeo, glowMat);
            glowStart.rotation.x = -Math.PI / 2;
            glowStart.position.set(from.x, 0.15, from.z);
            group.add(glowStart);

            const glowEnd = new THREE.Mesh(glowGeo, glowMat);
            glowEnd.rotation.x = -Math.PI / 2;
            glowEnd.position.set(to.x, 0.15, to.z);
            group.add(glowEnd);
        }

        function createSnake(group, from, to) {
            const fromVec = new THREE.Vector3(from.x, 0.15, from.z);
            const toVec = new THREE.Vector3(to.x, 0.15, to.z);

            const points = [];
            const segments = 20;

            // Create a wavy path
            const startDir = new THREE.Vector3().subVectors(toVec, fromVec).normalize();
            const perp = new THREE.Vector3(-startDir.z, 0, startDir.x);

            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const basePos = fromVec.clone().lerp(toVec, t);
                // Wavy offset
                const waveAmount = Math.sin(t * Math.PI * 4) * 0.5;
                const offset = perp.clone().multiplyScalar(waveAmount);
                // Arc height
                const heightArc = Math.sin(t * Math.PI) * 0.5;
                const pos = basePos.clone().add(offset);
                pos.y += heightArc;
                points.push(pos);
            }

            const curve = new THREE.CatmullRomCurve3(points);
            const tubeGeo = new THREE.TubeGeometry(curve, 40, 0.15, 8, false);

            const snakeMat = new THREE.MeshStandardMaterial({
                color: 0x2d8a2d,
                emissive: 0x0a4a0a,
                emissiveIntensity: 0.3,
                roughness: 0.4,
                metalness: 0.2
            });

            const snake = new THREE.Mesh(tubeGeo, snakeMat);
            snake.castShadow = true;
            group.add(snake);

            // Snake head (sphere at end)
            const headGeo = new THREE.SphereGeometry(0.25, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({
                color: 0x1a6b1a,
                emissive: 0x00ff00,
                emissiveIntensity: 0.2,
                roughness: 0.3
            });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.copy(points[points.length - 1]);
            head.castShadow = true;
            group.add(head);

            // Snake eyes
            const eyeGeo = new THREE.SphereGeometry(0.06, 8, 8);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            const eye1 = new THREE.Mesh(eyeGeo, eyeMat);
            eye1.position.copy(points[points.length - 1]).add(new THREE.Vector3(0.1, 0.1, 0.1));
            group.add(eye1);
            const eye2 = new THREE.Mesh(eyeGeo, eyeMat);
            eye2.position.copy(points[points.length - 1]).add(new THREE.Vector3(-0.1, 0.1, 0.1));
            group.add(eye2);

            // Tail glow
            const tailGeo = new THREE.SphereGeometry(0.18, 12, 12);
            const tailMat = new THREE.MeshStandardMaterial({
                color: 0xff4400,
                emissive: 0xff2200,
                emissiveIntensity: 0.5,
                transparent: true,
                opacity: 0.7
            });
            const tail = new THREE.Mesh(tailGeo, tailMat);
            tail.position.copy(points[0]);
            group.add(tail);
        }

        // ==================== ANIMASI LOOP ====================
        function animate() {
            requestAnimationFrame(animate);

            // Bobbing pieces
            const time = Date.now() * 0.003;
            if (playerPiece && !isAnimating) {
                playerPiece.position.y = 0.6 + Math.sin(time) * 0.05;
                playerPiece.rotation.y += 0.01;
            }
            if (aiPiece && !isAnimating) {
                aiPiece.position.y = 0.6 + Math.sin(time + Math.PI) * 0.05;
                aiPiece.rotation.y -= 0.01;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==================== LOGIKA GAME ====================
        function rollDice() {
            return Math.floor(Math.random() * 6) + 1;
        }

        function updateUI() {
            document.getElementById('pos-white').innerHTML = `${playerPos} <small>/ 100</small>`;
            document.getElementById('pos-black').innerHTML = `${aiPos} <small>/ 100</small>`;

            const playerCard = document.getElementById('player-white');
            const aiCard = document.getElementById('player-black');
            const turnIndicator = document.getElementById('turn-indicator');
            const rollBtn = document.getElementById('roll-btn');

            if (currentTurn === 'player') {
                playerCard.classList.add('active');
                aiCard.classList.remove('active');
                turnIndicator.textContent = '🎯 Giliran Pemain';
                turnIndicator.className = 'turn-indicator white-turn';
                rollBtn.disabled = false;
            } else {
                playerCard.classList.remove('active');
                aiCard.classList.add('active');
                turnIndicator.textContent = '🤖 Giliran AI';
                turnIndicator.className = 'turn-indicator black-turn';
                rollBtn.disabled = true;
            }
        }

        async function handleRoll() {
            if (isAnimating || !gameActive || currentTurn !== 'player') return;

            isAnimating = true;
            document.getElementById('roll-btn').disabled = true;

            // Animate dice
            const diceDisplay = document.getElementById('dice-display');
            diceDisplay.classList.add('rolling');

            // Random dice animation
            let rollCount = 0;
            const rollInterval = setInterval(() => {
                diceDisplay.textContent = ['⚀','⚁','⚂','⚃','⚄','⚅'][Math.floor(Math.random() * 6)];
                rollCount++;
                if (rollCount > 10) clearInterval(rollInterval);
            }, 60);

            await sleep(700);

            clearInterval(rollInterval);
            diceValue = rollDice();
            diceDisplay.textContent = ['⚀','⚁','⚂','⚃','⚄','⚅'][diceValue - 1];
            diceDisplay.classList.remove('rolling');

            await sleep(300);

            // Move player
            await movePlayer(playerPos, diceValue, 'player');

            isAnimating = false;

            if (gameActive && currentTurn === 'player') {
                // Check win
                if (playerPos >= 100) {
                    endGame('player');
                    return;
                }
                // Switch turn to AI
                currentTurn = 'ai';
                updateUI();
                setTimeout(aiTurn, 1000);
            }
        }

        async function movePlayer(currentPos, steps, who) {
            let newPos = currentPos + steps;
            if (newPos > 100) newPos = 100;

            const piece = who === 'player' ? playerPiece : aiPiece;
            const startPos = tileNumberToPosition(currentPos || 1);

            // Animate movement step by step
            for (let i = currentPos + 1; i <= newPos; i++) {
                const pos = tileNumberToPosition(i);
                const startTime = Date.now();
                const duration = 150;

                const startX = piece.position.x;
                const startZ = piece.position.z;

                await new Promise(resolve => {
                    function stepAnim() {
                        const elapsed = Date.now() - startTime;
                        const t = Math.min(elapsed / duration, 1);
                        const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

                        piece.position.x = startX + (pos.x - startX) * ease + (who === 'player' ? -0.25 : 0.25);
                        piece.position.z = startZ + (pos.z - startZ) * ease + (who === 'player' ? -0.25 : 0.25);
                        piece.position.y = 0.6 + Math.sin(t * Math.PI) * 0.5;

                        if (t < 1) {
                            requestAnimationFrame(stepAnim);
                        } else {
                            resolve();
                        }
                    }
                    stepAnim();
                });

                await sleep(30);
            }

            // Update position
            if (who === 'player') {
                playerPos = newPos;
            } else {
                aiPos = newPos;
            }
            updateUI();

            // Check for snake or ladder
            await sleep(300);
            await checkSnakeOrLadder(newPos, who);
        }

        async function checkSnakeOrLadder(position, who) {
            if (SNAKES_AND_LADDERS[position] !== undefined) {
                const target = SNAKES_AND_LADDERS[position];
                const isLadder = target > position;
                const piece = who === 'player' ? playerPiece : aiPiece;

                // Flash effect
                const originalColor = piece.material.color.getHex();
                const flashColor = isLadder ? 0x00ff00 : 0xff0000;

                for (let i = 0; i < 3; i++) {
                    piece.material.color.setHex(flashColor);
                    piece.material.emissive.setHex(flashColor);
                    piece.material.emissiveIntensity = 0.8;
                    await sleep(150);
                    piece.material.color.setHex(originalColor);
                    piece.material.emissive.setHex(who === 'player' ? 0xffffff : 0xff3300);
                    piece.material.emissiveIntensity = 0.2;
                    await sleep(150);
                }

                // Animate slide/climb
                const startPos = tileNumberToPosition(position);
                const endPos = tileNumberToPosition(target);

                const startTime = Date.now();
                const duration = 800;

                await new Promise(resolve => {
                    function slideAnim() {
                        const elapsed = Date.now() - startTime;
                        const t = Math.min(elapsed / duration, 1);
                        const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

                        const x = startPos.x + (endPos.x - startPos.x) * ease;
                        const z = startPos.z + (endPos.z - startPos.z) * ease;
                        const y = 0.6 + Math.sin(t * Math.PI) * 1.5;

                        piece.position.set(
                            x + (who === 'player' ? -0.25 : 0.25),
                            y,
                            z + (who === 'player' ? -0.25 : 0.25)
                        );

                        if (t < 1) {
                            requestAnimationFrame(slideAnim);
                        } else {
                            resolve();
                        }
                    }
                    slideAnim();
                });

                // Update position
                if (who === 'player') {
                    playerPos = target;
                } else {
                    aiPos = target;
                }
                updateUI();

                // Check win after snake/ladder
                if (target >= 100) {
                    if (who === 'player') {
                        endGame('player');
                    } else {
                        endGame('ai');
                    }
                    return true;
                }
            }
            return false;
        }

        async function aiTurn() {
            if (!gameActive) return;

            isAnimating = true;
            await sleep(500);

            // AI rolls dice
            const diceDisplay = document.getElementById('dice-display');
            diceDisplay.classList.add('rolling');

            let rollCount = 0;
            const rollInterval = setInterval(() => {
                diceDisplay.textContent = ['⚀','⚁','⚂','⚃','⚄','⚅'][Math.floor(Math.random() * 6)];
                rollCount++;
                if (rollCount > 8) clearInterval(rollInterval);
            }, 80);

            await sleep(700);

            clearInterval(rollInterval);
            diceValue = rollDice();
            diceDisplay.textContent = ['⚀','⚁','⚂','⚃','⚄','⚅'][diceValue - 1];
            diceDisplay.classList.remove('rolling');

            await sleep(300);

            // Move AI
            await movePlayer(aiPos, diceValue, 'ai');

            isAnimating = false;

            if (gameActive && currentTurn === 'ai') {
                if (aiPos >= 100) {
                    endGame('ai');
                    return;
                }
                currentTurn = 'player';
                updateUI();
            }
        }

        function endGame(winner) {
            gameActive = false;
            const msgBox = document.getElementById('message-box');
            const title = document.getElementById('message-title');
            const text = document.getElementById('message-text');

            if (winner === 'player') {
                title.textContent = '🎉 Kamu Menang!';
                text.textContent = 'Selamat! Kamu berhasil mengalahkan AI. 🏆';
            } else {
                title.textContent = '😢 Kamu Kalah!';
                text.textContent = 'AI berhasil mencapai kotak 100 lebih dulu. Coba lagi!';
            }

            msgBox.classList.remove('hidden');
            document.getElementById('roll-btn').disabled = true;
            document.getElementById('turn-indicator').textContent = '🏁 Permainan Selesai';
        }

        function restartGame() {
            playerPos = 0;
            aiPos = 0;
            currentTurn = 'player';
            gameActive = true;
            isAnimating = false;

            // Reset pieces
            const pPos = tileNumberToPosition(1);
            playerPiece.position.set(pPos.x - 0.25, 0.6, pPos.z - 0.25);
            aiPiece.position.set(pPos.x + 0.25, 0.6, pPos.z + 0.25);

            playerPiece.material.color.setHex(0xffffff);
            playerPiece.material.emissive.setHex(0xffffff);
            aiPiece.material.color.setHex(0x222222);
            aiPiece.material.emissive.setHex(0xff3300);

            document.getElementById('message-box').classList.add('hidden');
            document.getElementById('dice-display').textContent = '🎲';
            updateUI();
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ==================== EVENT LISTENERS ====================
        document.getElementById('roll-btn').addEventListener('click', handleRoll);
        document.getElementById('restart-btn').addEventListener('click', restartGame);

        // Touch/Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !document.getElementById('roll-btn').disabled) {
                e.preventDefault();
                handleRoll();
            }
        });

        // ==================== MULAI GAME ====================
        initThree();
        updateUI();
    </script>
</body>
</html>
